[project]
name = "hellodj-voice-pipeline"
version = "0.1.0"
description = "HelloDJ voice-pipeline component: local ONNX wake word detection (the only on-box AI) with STT, intent, and TTS delegated to Amazon Bedrock (+ Transcribe/Polly) over an IAM task role. Consumes Discord voice (opus) via bot-core and dispatches actions to the playback-orchestrator."
requires-python = ">=3.14"
readme = "README.md"

# Runtime dependencies. onnxruntime runs the tiny local wake word model — the
# only on-box AI in this component. boto3 reaches Amazon Bedrock / Transcribe /
# Polly using the pod's IAM task role via the default credential chain (no
# static keys). numpy backs mel-spectrogram feature extraction. Discord voice
# (opus) is consumed via bot-core, so no discord/voice dependency lives here.
dependencies = [
    "onnxruntime>=1.17",
    "boto3>=1.34",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_pipeline*"]

# ---------------------------------------------------------------------------
# ruff — PEP 8 style enforcement (Requirement 13.2), aligned with the
# monorepo-root pyproject.toml so this independently deployable component
# (R15.1) lints identically in isolation.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
"**/test_*.py" = ["B011"]

[tool.hellodj.line_count]
max-line-count = 500

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
