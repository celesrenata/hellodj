{% if guilds %}
  <ul class="guild-list__items">
    {% for guild in guilds %}
      <li class="glass-panel guild-row">
        <span class="guild-row__name">{{ guild.name }}</span>
        <span class="guild-row__meta">{{ guild.get('members', 0) }} members</span>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="guild-list__empty panel-section__muted">No guilds found.</p>
{% endif %}
