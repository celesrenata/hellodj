<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password · HelloDJ</title>
  <link rel="stylesheet" href="{{ static_hash('css/app.css') }}">
</head>
<body class="bg-surface-0 text-text-secondary login-body">
  <canvas id="bg-shader" class="fixed inset-0 -z-10 w-full h-full pointer-events-none" aria-hidden="true"></canvas>

  <main class="login-shell" role="main">
    <div class="glass-panel login-card">
      <h1 class="login-card__title">HelloDJ</h1>
      <p class="login-card__subtitle">Set a new password to finish signing in</p>

      <div aria-live="polite">
        {% if error %}
          <p class="notice notice--danger" role="alert">{{ error }}</p>
        {% endif %}
      </div>

      <form method="post" action="{{ url_for('auth.admin_login_challenge') }}" class="auth-form">
        <label class="field">
          <span class="field__label">New password</span>
          <input class="field__input" type="password" name="new_password"
                 autocomplete="new-password" required autofocus>
        </label>
        <p class="field__hint">Min 12 characters with upper, lower, number, and symbol.</p>
        <button type="submit" class="btn btn-primary btn-block">Set password</button>
      </form>

      <div class="login-card__links">
        <a href="{{ url_for('pages.login') }}">Back to sign in</a>
      </div>
    </div>
  </main>
</body>
</html>
