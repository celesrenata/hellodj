<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · HelloDJ</title>
  <link rel="stylesheet" href="{{ static_hash('css/app.css') }}">
</head>
<body class="bg-surface-0 text-text-secondary login-body">
  <canvas id="bg-shader" class="fixed inset-0 -z-10 w-full h-full pointer-events-none" aria-hidden="true"></canvas>

  <main class="login-shell" role="main">
    <div class="glass-panel login-card">
      <h1 class="login-card__title">HelloDJ</h1>
      <p class="login-card__subtitle">Sign in to the control panel</p>

      {% if error == 'denied' %}
        <p class="notice notice--danger" role="alert">Authorization was denied.</p>
      {% elif error == 'state_mismatch' %}
        <p class="notice notice--danger" role="alert">Session expired. Please try again.</p>
      {% endif %}

      <a class="btn btn-primary btn-block" href="{{ url_for('auth.login') }}">
        Log in with Discord
      </a>
      <a class="btn btn-ghost btn-block" href="{{ url_for('auth.admin_login') }}">
        Administrator sign in
      </a>

      <div class="login-card__links">
        <a href="{{ url_for('auth.register') }}">Register</a>
        <span aria-hidden="true">·</span>
        <a href="{{ url_for('auth.recover') }}">Recover account</a>
      </div>
    </div>
  </main>
</body>
</html>
