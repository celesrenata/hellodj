[project]
name = "hellodj-web-ui"
version = "0.1.0"
description = "HelloDJ web-ui component: Flask + HTMX + Alpine + Tailwind v4 dark-glassmorphism admin UI (Cognito/Discord/Tidal auth, DynamoDB config, Secrets Manager)."
requires-python = ">=3.14"
readme = "README.md"

# Runtime dependencies:
#   Flask/gunicorn — the admin UI server.
#   boto3          — DynamoDB config store + Secrets Manager provider.
# The shared pure decision logic (auth_routing, tidal_refresh) is consumed from
# the monorepo's hellodj_platform_logic package (install editable or via
# PYTHONPATH=components), giving IaC and runtime one source of truth (R15).
dependencies = [
    "Flask>=3.0",
    "gunicorn>=22.0",
    "boto3>=1.34",
    "hellodj-platform-logic",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "Flask>=3.0",
]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# ruff — PEP 8 style enforcement (Requirement 13.2), aligned with the
# monorepo-root pyproject.toml so this independently deployable component
# (R15.1) lints identically in isolation.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
"**/test_*.py" = ["B011"]

[tool.hellodj.line_count]
max-line-count = 500

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
