[package]
name = "spotify-stream"
version = "0.1.0"
edition = "2021"
description = "HelloDJ direct Spotify streaming sidecar — a thin librespot wrapper exposing a direct-stream HTTP interface on port 8802. Spotify credentials are injected at runtime from AWS Secrets Manager (never baked in)."
license = "MIT"

# NOTE(artifact-source): this is a minimal skeleton. The real dependency set
# (librespot crates, an async HTTP server, etc.) and a committed Cargo.lock are
# required before the Nix `rustPlatform.buildRustPackage` path in ../flake.nix
# can build this from source. Until then ../flake.nix packages upstream
# `pkgs.librespot` plus the entrypoint wrapper, and this crate is the
# structural reference for the direct-stream surface.
[dependencies]
# librespot = "0.5"            # streaming engine (Spotify Connect client)
# tokio = { version = "1", features = ["full"] }
# hyper = { version = "1", features = ["server", "http1"] }

[[bin]]
name = "spotify-stream"
path = "src/main.rs"
