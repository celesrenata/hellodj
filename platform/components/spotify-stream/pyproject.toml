[project]
name = "hellodj-spotify-stream"
version = "0.1.0"
description = "HelloDJ spotify-stream component: per-user librespot session pool streaming sidecar (unified per-user credential store, read-only)."
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies:
#   aiohttp   — async HTTP server (streaming + capture endpoints).
#   librespot — the Python Spotify streaming client (per-user Session).
#   boto3     — DynamoDB read + KMS Decrypt for the unified credential store.
# The shared pure logic (session_registry, user_credential_resolver, token_crypto)
# is consumed from the monorepo's hellodj_platform_logic package (install
# editable or via PYTHONPATH=components), giving IaC and runtime one source of
# truth (R9).
dependencies = [
    "aiohttp>=3.9",
    "librespot",
    "boto3>=1.34",
    "hellodj-platform-logic",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "aiohttp>=3.9",
]
dev = [
    "ruff>=0.6",
]

[project.scripts]
hellodj-spotify-stream = "spotify_stream.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spotify_stream*"]

# ---------------------------------------------------------------------------
# ruff — PEP 8 style enforcement, aligned with the monorepo-root pyproject.toml
# so this independently deployable component lints identically in isolation.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
"**/test_*.py" = ["B011"]

[tool.hellodj.line_count]
max-line-count = 500

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "-ra"
