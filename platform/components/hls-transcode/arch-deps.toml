# Per-component ARM64 (Graviton) dependency-compatibility manifest (task 18.4).
#
# Consumed by tools/gate_dependencies.py -> hellodj_platform_logic.dependency_gate.gate()
# to decide ARM64-only vs an x86-64 fallback for this component (Requirement 4).
# Set a dependency false + add a [notes] entry to force x86-64 and document why
# (R4.3, R4.4).
#
# hls-transcode is the media transcode toolchain: Python 3.11 + FFmpeg. The
# default (floor) path is libx264 software transcode on Graviton, which builds
# and runs on ARM64; the optional NVENC path uses a G5g (Graviton2 + NVIDIA
# T4G) node that also keeps the ARM64 architecture (design Decision D3/D2).
# The audio_libraries and visualizer rendering deps are ARM64-compatible.

[dependencies]
transcode_toolchain = true
audio_libraries = true
