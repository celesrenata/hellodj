[project]
name = "hellodj-tidal-stream"
version = "0.1.0"
description = "HelloDJ tidal-stream component: direct Tidal streaming sidecar with first-party single-app-id OAuth (Secrets Manager-backed refresh)."
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies:
#   aiohttp — async HTTP server (streaming + /auth/callback) and Tidal API client.
#   boto3   — AWS Secrets Manager client for the refresh-token store.
# The shared pure decision logic (tidal_refresh) is consumed from the monorepo's
# hellodj_platform_logic package (install editable or via PYTHONPATH=components),
# giving IaC and runtime one source of truth (R15).
dependencies = [
    "aiohttp>=3.9",
    "boto3>=1.34",
    "hellodj-platform-logic",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
]
dev = [
    "ruff>=0.6",
]

[project.scripts]
hellodj-tidal-stream = "tidal_stream.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tidal_stream*"]

# ---------------------------------------------------------------------------
# ruff — PEP 8 style enforcement (Requirement 13.2), aligned with the
# monorepo-root pyproject.toml so this independently deployable component
# (R15.1) lints identically in isolation.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
"**/test_*.py" = ["B011"]

[tool.hellodj.line_count]
max-line-count = 500

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "-ra"
