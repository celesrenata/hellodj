[project]
name = "hellodj-migration"
version = "0.1.0"
description = "One-time clean-slate migration Job: seeds only the admin bootstrap credential into Cognito; all other data starts fresh in DynamoDB (R19)."
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies:
#   boto3 — AWS clients (cognito-idp seeder, S3 export reader, DynamoDB probe).
#           Imported lazily inside client factories so the package imports for
#           tests / py_compile without AWS libraries present.
# The clean-slate migration filter is consumed from the monorepo's
# hellodj_platform_logic package (install editable or via PYTHONPATH=components),
# giving IaC and runtime one source of truth (R15).
dependencies = [
    "boto3>=1.34",
    "hellodj-platform-logic",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "moto[cognitoidp,s3,dynamodb]>=5.0",
]

[project.scripts]
# Entry point suitable for a one-time Kubernetes Job / pre-deploy init step.
hellodj-migrate = "migration_job.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["migration_job*"]
