[project]
name = "hellodj-activity-backend"
version = "0.1.0"
description = "HelloDJ activity-backend component: aiohttp Discord Activity server (video control, whiteboard, visualizer control, synced lyrics) with a WebSocket hub over ALB/CloudFront /activity/. Emits transcode requests to hls-transcode and serves/reads HLS from S3 via CloudFront."
requires-python = ">=3.14"
readme = "README.md"

# Runtime dependencies. aiohttp drives the HTTP endpoints and the WebSocket hub;
# boto3 is available for any AWS SDK access (e.g. presigning/S3 metadata). Both
# are imported lazily where needed so the modules import for tests/py_compile
# without them installed. The shared pure decision logic is consumed from the
# monorepo's hellodj_platform_logic package.
dependencies = [
    "aiohttp>=3.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
activity-backend = "activity_backend.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["activity_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
