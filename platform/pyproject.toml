[project]
name = "hellodj-platform"
version = "0.1.0"
description = "HelloDJ AWS re-platform monorepo: shared decision logic and per-component packages."
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependency: the shared pure-logic package is importable across all components.
dependencies = []

[project.optional-dependencies]
# Test dependencies (Requirement 13 tooling; property-based tests per design).
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    # DynamoDB data-access layer (task 7.1/7.2): boto3 for the injected resource
    # tables, moto for an in-process DynamoDB used by the round-trip tests.
    "boto3>=1.34",
    "moto[dynamodb]>=5.0",
]
# Lint/style tooling (PEP 8 enforcement — Requirements 13.2, 13.3, 13.4).
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The shared pure-logic package lives under components/ and is importable directly.
package-dir = { "" = "components" }

[tool.setuptools.packages.find]
where = ["components"]
include = ["hellodj_platform_logic*"]

# ---------------------------------------------------------------------------
# ruff — PEP 8 style enforcement (Requirement 13.2)
# ---------------------------------------------------------------------------
[tool.ruff]
# Target the platform Python baseline (3.14 on CodeBuild standard:8.0).
target-version = "py314"
# Hard cap on line length; the max-line-count hook enforces the per-file line
# ceiling separately (Requirement 13.3).
line-length = 100
# Only lint the platform's own Python sources.
extend-exclude = [
    "infra/cdk.out",
    "infra/cdk-out-deploy",
    "infra/node_modules",
    ".venv",
    "**/__pycache__",
]

[tool.ruff.lint]
# PEP 8 core rule families:
#   E/W  — pycodestyle (PEP 8 layout/whitespace)
#   F    — pyflakes (undefined names, unused imports)
#   I    — import ordering
#   N    — PEP 8 naming conventions
#   UP   — pyupgrade (modern idioms)
#   B    — bugbear (common correctness pitfalls)
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy patterns and long Hypothesis strategy lines.
"**/tests/**" = ["B011"]
"**/test_*.py" = ["B011"]

# ---------------------------------------------------------------------------
# Custom max-line-count check hook (Requirement 13.3)
# ---------------------------------------------------------------------------
# Enforced by tools/check_line_count.py. Kept here so both the tool and the
# deployment-pipeline PEP8/line-count gate read a single configured value.
[tool.hellodj.line_count]
max-line-count = 500

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["components", "infra"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
