# Lavalink configuration for HelloDJ
# NO SECRETS IN THIS FILE — all credentials are pushed at runtime by the bot
# from the encrypted credential store via REST endpoints.

lavalink:
  server:
    host: "0.0.0.0"
    port: 2333
    password: "youshallnotpass"
    pluginsDir: "./plugins"
    sources:
      youtube: false
  buffer:
    period: 500
    periodMilliseconds: 500
  limits:
    memory: 0
    cpu: 0

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - MUSIC
      - WEB
    clientOptions:
      MUSIC:
        playback: false
        videoLoading: false
    # OAuth disabled at config level — bot pushes token at runtime
    oauth:
      enabled: false
    # Remote cipher server (in-cluster)
    remoteCipher:
      url: "http://yt-cipher.hellodj-service.svc.cluster.local:8001"
      password: ""
      userAgent: "hellodj"
  lavasrc:
    providers:
      - "scsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      tidal: true
      youtube: true
    tidal:
      countryCode: "US"
      searchLimit: 6
      clientId: ""
      clientSecret: ""
      token: "expired-placeholder-bot-refreshes-at-runtime"
    spotify:
      clientId: "5335dad8d1a34e32b397c7da73c9febc"
      clientSecret: "6b6ac99207064a9284945ee769a7b681"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: false

sources:
  youtube:
    enabled: true
  youtubemusic:
    enabled: true
  soundcloud:
    enabled: true
  spotify:
    enabled: true

filters:
  enabled: true
  volume:
    enabled: true
  equalizer:
    enabled: true
  karaoke:
    enabled: true
  timescale:
    enabled: true
  tremolo:
    enabled: true
  vibrato:
    enabled: true
  distortion:
    enabled: true
  rotation:
    enabled: true
  lowPass:
    enabled: true
  channelMix:
    enabled: true

server:
  port: 2333
