<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="discord-client-id" content="1534778518137995325">
    <title>HelloDJ Video</title>
    <link rel="stylesheet" href="static/style.css?v=18">
    <script src="static/hls.min.js"></script>
    <script src="static/whiteboard-bundle.js?v=5"></script>
    <script type="module" src="static/app.js?v=34"></script>
</head>
<body>
    <div id="app">
        <!-- Whiteboard HUD — above video as a flow element -->
        <div class="whiteboard-hud" id="whiteboard-hud">
            <div class="hud-tools">
                <button class="hud-btn" data-tool="pen" title="Pen">✏️</button>
                <button class="hud-btn" data-tool="line" title="Line">📏</button>
                <button class="hud-btn" data-tool="shape" title="Shape">⬜</button>
                <button class="hud-btn" data-tool="text" title="Text">🔤</button>
                <button class="hud-btn" data-tool="eraser" title="Eraser">🧹</button>
                <button class="hud-btn" data-tool="sticker" title="Sticker">😀</button>
            </div>
            <div class="hud-divider"></div>
            <div class="hud-sliders">
                <label class="hud-slider-label" title="Stroke size">
                    <span>Size</span>
                    <input type="range" id="stroke-size" class="hud-slider" min="1" max="20" value="3">
                </label>
                <label class="hud-slider-label" title="Opacity">
                    <span>Opacity</span>
                    <input type="range" id="stroke-opacity" class="hud-slider" min="10" max="100" value="100">
                </label>
            </div>
            <div class="hud-divider"></div>
            <div class="hud-colors">
                <button class="color-swatch" data-color="#FFFFFF" title="White" style="background:#FFFFFF;"></button>
                <button class="color-swatch" data-color="#FF0000" title="Red" style="background:#FF0000;"></button>
                <button class="color-swatch" data-color="#FF8800" title="Orange" style="background:#FF8800;"></button>
                <button class="color-swatch" data-color="#FFFF00" title="Yellow" style="background:#FFFF00;"></button>
                <button class="color-swatch" data-color="#00FF00" title="Green" style="background:#00FF00;"></button>
                <button class="color-swatch" data-color="#00FFFF" title="Cyan" style="background:#00FFFF;"></button>
                <button class="color-swatch" data-color="#0088FF" title="Blue" style="background:#0088FF;"></button>
                <button class="color-swatch" data-color="#AA00FF" title="Purple" style="background:#AA00FF;"></button>
                <input type="color" class="color-custom" id="color-custom" value="#FFFFFF" title="Custom color">
            </div>
            <div class="hud-divider"></div>
            <div class="hud-options">
                <label class="hud-checkbox" title="Text background">
                    <input type="checkbox" id="text-bg-toggle"> Bg
                </label>
            </div>
            <div class="hud-divider"></div>
            <div class="hud-actions">
                <button class="hud-btn" id="btn-undo" title="Undo">↩️</button>
                <button class="hud-btn" id="btn-reset" title="Reset whiteboard">🗑️</button>
            </div>
        </div>

        <div class="video-container" id="video-container">
            <video id="player" autoplay playsinline></video>
            <canvas id="whiteboard-canvas"></canvas>

            <!-- Sticker picker -->
            <div class="sticker-picker" id="sticker-picker" style="display: none;">
                <div class="sticker-picker-header">
                    <span>Stickers</span>
                    <button class="sticker-picker-close" id="sticker-picker-close" title="Close">✕</button>
                </div>
                <div class="sticker-picker-categories" id="sticker-picker-categories"></div>
                <div class="sticker-picker-grid" id="sticker-picker-grid"></div>
            </div>

            <!-- Video controls overlay -->
            <div class="controls-overlay" id="controls-overlay">
                <div class="title-bar" id="title-bar"></div>
                <div class="bottom-controls">
                    <div class="scrubber" id="scrubber">
                        <div class="scrubber-track"></div>
                        <div class="scrubber-buffered" id="scrubber-buffered"></div>
                        <div class="scrubber-fill" id="scrubber-fill"></div>
                        <div class="scrubber-thumb" id="scrubber-thumb"></div>
                        <div class="scrubber-tooltip" id="scrubber-tooltip">0:00</div>
                    </div>
                    <div class="controls-row">
                        <button class="ctrl-btn" id="btn-back" title="Back 10s">⏪</button>
                        <button class="ctrl-btn" id="btn-playpause" title="Play/Pause">⏸️</button>
                        <button class="ctrl-btn" id="btn-forward" title="Forward 10s">⏩</button>
                        <span class="time-display" id="time-display">0:00 / 0:00</span>
                        <div class="track-selector" id="subtitle-selector" style="display:none">
                            <select id="subtitle-select" title="Subtitles"><option value="">Off</option></select>
                            <label class="for-everyone"><input type="checkbox" id="subtitle-for-everyone"> All</label>
                        </div>
                        <div class="track-selector" id="audio-selector" style="display:none">
                            <select id="audio-select" title="Audio"><option value="">Default</option></select>
                            <label class="for-everyone"><input type="checkbox" id="audio-for-everyone"> All</label>
                        </div>
                        <button class="ctrl-btn" id="btn-whiteboard" title="Whiteboard" data-active="false">🖊️</button>
                        <button class="ctrl-btn" id="btn-mute" title="Mute">🔊</button>
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80">
                    </div>
                </div>
            </div>

            <div class="error-overlay" id="error-overlay">
                <span id="error-message"></span>
            </div>
        </div>
    </div>
</body>
</html>
