apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hellodj-service

resources:
  - namespace.yaml
  - configmap.yaml
  - bot-configmap.yaml
  - pvc.yaml
  - nfs-pv.yaml
  - nfs-pvc.yaml
  - models-nfs-pv.yaml
  - models-pvc.yaml
  - service.yaml
  - deployment.yaml
  - web-ui-service.yaml
  - web-ui-deployment.yaml
  - ingress.yaml

# Image tags
images:
  - name: registry.celestium.life/hellodj/bot
    newTag: latest
  - name: registry.celestium.life/hellodj/web-ui
    newTag: latest
