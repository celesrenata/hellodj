apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hellodj-service

resources:
  - namespace.yaml
  - configmap.yaml
  - bot-configmap.yaml
  - youtube-secret.yaml
  - yt-cipher-secret.yaml
  - yt-cipher-deployment.yaml
  - yt-cipher-service.yaml
  - pvc.yaml
  - nfs-pv.yaml
  - nfs-pvc.yaml
  - models-nfs-pv.yaml
