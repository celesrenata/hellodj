apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellodj-web-ui
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj-web-ui
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: web-ui
    helm.sh/chart: hellodj-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: hellodj
      app.kubernetes.io/name: hellodj-web-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hellodj
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/name: hellodj-web-ui
        app.kubernetes.io/version: latest
        app.kubernetes.io/component: web-ui
        helm.sh/chart: hellodj-0.1.0
    spec:
      imagePullSecrets:
        - name: harbor-credentials
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      containers:
        - name: web-ui
          image: registry.celestium.life/hellodj/web-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # HOME must point to a writable path; UID 1000 otherwise hits
            # PermissionError on gunicorn's /.gunicorn control socket
            - name: HOME
              value: /app/data
            - name: HELLODJ_DATA_DIR
              value: /app/data
            - name: HELLODJ_CONFIG_DIR
              value: /app/config
            - name: HELLODJ_BACKUP_DIR
              value: /app/config-backups
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: DISCORD_TOKEN
                  optional: true
            - name: DISCORD_APPID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: DISCORD_APPID
                  optional: true
            - name: DISCORD_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: DISCORD_PUBKEY
                  optional: true
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: DISCORD_CLIENT_SECRET
                  optional: true
            - name: FLASK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: FLASK_SECRET
                  optional: true
            # ── OAuth provider credentials (hellodj-secret) ─────────────
            # These are read by web-ui/app.py provider_credentials() which
            # consults the .env file at /app/data/.env; the secret values must
            # also be mirrored into that .env for the /api/providers/status UI.
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: SPOTIFY_CLIENT_ID
                  optional: true
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: SPOTIFY_CLIENT_SECRET
                  optional: true
            - name: TIDAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_CLIENT_ID
                  optional: true
            - name: TIDAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_CLIENT_SECRET
                  optional: true
            - name: TIDAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_TOKEN
                  optional: true
            - name: TIDAL_ENABLED
              value: "true"
            - name: TIDAL_COUNTRY_CODE
              value: US
            - name: TIDAL_SEARCH_LIMIT
              value: "6"
            - name: GENIUS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_CLIENT_ID
                  optional: true
            - name: GENIUS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_CLIENT_SECRET
                  optional: true
            - name: GENIUS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_ACCESS_TOKEN
                  optional: true
            - name: GENIUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_API_KEY
                  optional: true
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /app/data
              name: hellodj-data
            - mountPath: /app/config
              name: hellodj-config
            - mountPath: /app/config-backups
              name: hellodj-config-backups
      volumes:
        - name: hellodj-data
          persistentVolumeClaim:
            claimName: hellodj-data-pvc
        - name: hellodj-config
          persistentVolumeClaim:
            claimName: hellodj-config-pvc
        - name: hellodj-config-backups
          emptyDir: {}
