# Placeholder secret for the youtube-source plugin OAuth credentials.
#
# The youtube-source plugin (dev.lavalink.youtube:youtube-plugin:1.18.2) does NOT
# support the deprecated built-in source's `email`/`password` keys. It authenticates
# via an OAuth refresh token (https://github.com/lavalink-devs/youtube-source#using-oauth-tokens).
#
# How to fill real values:
#   1. Run the bot/lavalink once with `plugins.youtube.oauth.enabled: true` and an
#      empty refresh token — it will print a device code (https://www.google.com/device).
#   2. Authorize with a BURNER Google account (not your primary), then paste the
#      printed refresh token as the value below.
#   3. Set YOUTUBE_OAUTH_ENABLED=true in kube/deployment.yaml (init container env)
#      and re-apply.
#
# The deployment references this secret with `optional: true`, so an absent/empty
# secret does not block startup — the plugin just runs without OAuth.
apiVersion: v1
kind: Secret
metadata:
  name: youtube-secret
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: lavalink
    helm.sh/chart: hellodj-0.1.0
type: Opaque
stringData:
  YOUTUBE_OAUTH_REFRESH_TOKEN: "" # TODO: fill with the real OAuth refresh token
