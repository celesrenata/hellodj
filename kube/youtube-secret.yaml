# Secret for the youtube-source plugin OAuth refresh token.
#
# The youtube-source plugin (dev.lavalink.youtube:youtube-plugin:1.18.2) does NOT
# support the deprecated built-in source's `email`/`password` keys. It authenticates
# via an OAuth refresh token (https://github.com/lavalink-devs/youtube-source#using-oauth-tokens).
#
# CRITICAL (2026-08-17): the value MUST be present at CONFIG-RENDER time, not just
# pushed at runtime. Lavalink's plugin initializes OAuth at startup and spawns a
# `ce-token-poller` thread using whatever refreshToken is in application.yml. If
# this secret is empty, the rendered config has `refreshToken: ""`, the poller
# polls Google with the empty token forever (`Invalid status code for oauth2 token
# fetch: 400`), and TV (the only OAuth-capable client) cannot load login-required /
# age-restricted tracks -> "All clients failed to load the item". The bot's runtime
# push (POST /youtube, status=204) cannot break that already-running poller loop.
#
# The valid token is sourced from data/oauth.json (providers.youtube.refresh_token),
# written by the web-ui device flow. Keep this secret in sync with that store.
apiVersion: v1
kind: Secret
metadata:
  name: youtube-secret
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: lavalink
    helm.sh/chart: hellodj-0.1.0
type: Opaque
stringData:
  # Real refresh token (validated against Google token endpoint, 2026-08-17).
  YOUTUBE_OAUTH_REFRESH_TOKEN: "REDACTED_REFRESH_TOKEN"
