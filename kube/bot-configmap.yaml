apiVersion: v1
kind: ConfigMap
metadata:
  name: hellodj-bot-config
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: bot
    helm.sh/chart: hellodj-0.1.0
data:
  # ── Voice activation (non-secret) ────────────────────────────────────
  WAKE_WORD_MODEL_PATH: /app/models/Hello_DJ.onnx
  STT_MODEL_SIZE: base
  STT_ENGINE: local
  STT_URL: ""
  TTS_ENGINE: speaches
  TTS_VOICE: af_heart
  SPEACHES_URL: http://speaches.speaches-service.svc.cluster.local:8000
  VOICE_ENABLED: "true"
  # ── Voice-connect debug layer (switchable) ────────────────
  # HELLODJ_VOICE_DEBUG=1 logs per-channel permissions on the exact target
  # voice channel (honors overwrites) + raw VOICE_STATE_UPDATE /
  # VOICE_SERVER_UPDATE for the bot itself. Set to "0" to disable after the
  # ChannelTimeoutException diagnosis is complete.
  HELLODJ_VOICE_DEBUG: "1"
  # ── Music providers (non-secret enable toggles; credentials in hellodj-secret) ─
  PROVIDER_YOUTUBE: "true"
  PROVIDER_YOUTUBEMUSIC: "true"
  PROVIDER_SOUNDCLOUD: "true"
  PROVIDER_SPOTIFY: "true"
  PROVIDER_TIDAL: "true"
  # ── Tidal (non-secret defaults; TIDAL_TOKEN lives in hellodj-secret) ─
  TIDAL_ENABLED: "true"
  TIDAL_COUNTRY_CODE: "US"
  TIDAL_SEARCH_LIMIT: "6"
  # ── LLM / general-query defaults ────────────────────────────────────
  LLM_API_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
