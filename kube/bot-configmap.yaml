apiVersion: v1
kind: ConfigMap
metadata:
  name: hellodj-bot-config
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: bot
    helm.sh/chart: hellodj-0.1.0
data:
  # ── Voice activation (non-secret) ────────────────────────────────────
  WAKE_WORD_MODEL_PATH: /app/models/Hello_DJ.onnx
  STT_MODEL_SIZE: base
  STT_ENGINE: local
  STT_URL: ""
  STT_WHISPER_ENDPOINT: ""
  STT_API_KEY: ""
  TTS_ENGINE: speaches
  TTS_VOICE: af_heart
  SPEACHES_URL: http://speaches.speaches-service.svc.cluster.local:8000
  TTS_SPEACHES_ENDPOINT: http://speaches.speaches-service.svc.cluster.local:8000
  TTS_KOKORO_ENDPOINT: ""
  TTS_API_KEY: ""
  KOKORO_URL: ""
  VOICE_ENABLED: "true"
  # ── Cloud STT/TTS — AWS (Bedrock/Transcribe/Polly) ──────────────────
  # Credentials are secrets (hellodj-secret); non-secret AWS config here.
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: ""
  BEDROCK_S3_BUCKET: ""
  STT_BEDROCK_LANGUAGE: en-US
  STT_BEDROCK_TIMEOUT: "60"
  POLLY_VOICE_ID: Joanna
  POLLY_OUTPUT_FORMAT: mp3
  # ── Voice-connect debug layer (switchable) ────────────────
  # HELLODJ_VOICE_DEBUG=1 logs per-channel permissions on the exact target
  # voice channel (honors overwrites) + raw VOICE_STATE_UPDATE /
  # VOICE_SERVER_UPDATE for the bot itself. Set to "0" to disable after the
  # ChannelTimeoutException diagnosis is complete.
  HELLODJ_VOICE_DEBUG: "1"
  # ── Unified debug framework (debug.py) ───────────────────
  # Master switch for the debug framework (1=enabled, 0=disabled)
  HELLODJ_DEBUG: "1"
  # Comma-separated list of debug modules (* = all):
  #   player, bot, tidal, music, voice_cmd, session, radio, stream,
  #   filters, autoplay, audio_pipeline, wakeword, stt, tts, intent, query
  HELLODJ_DEBUG_MODULES: "*"
  # Minimum debug output level (DEBUG, INFO, WARNING)
  HELLODJ_DEBUG_LEVEL: "DEBUG"
  # Ultra-verbose function entry/exit tracing (0=off, 1=on)
  HELLODJ_DEBUG_TRACE: "0"
  # ── Music providers (non-secret enable toggles; credentials in hellodj-secret) ─
  PROVIDER_YOUTUBE: "true"
  PROVIDER_YOUTUBEMUSIC: "true"
  PROVIDER_SOUNDCLOUD: "true"
  PROVIDER_SPOTIFY: "true"
  PROVIDER_TIDAL: "true"
  # ── Tidal (non-secret defaults; TIDAL_TOKEN lives in hellodj-secret) ─
  # TIDAL_* configure the Lavalink Tidal source (the /play "tdsearch:" prefix).
  TIDAL_ENABLED: "true"
  TIDAL_COUNTRY_CODE: "US"
  TIDAL_SEARCH_LIMIT: "6"
  # ── Tidal music-video streaming (/stream cog) ─────────────────────────
  # TD_ENABLED toggles the /stream cog. TD_CLIENT_ID / TD_CLIENT_SECRET are
  # OAuth client-credentials for the Tidal Web API — they are SECRETS and
  # must live in hellodj-secret (never commit them here).
  TD_ENABLED: "true"
  # ── YouTube poToken (Proof of Origin, optional) ────────────────────
  # Defeats YouTube's bot-detection ("Sign in to confirm you're not a bot" /
  # "The page needs to be reloaded" / "No supported audio streams available")
  # for the non-OAuth WEB-family clients. Generate a fresh token via
  # https://github.com/iv-org/youtube-trusted-session-generator and set both
  # values (they must be provided together). Leave blank to disable.
  POT_TOKEN: ""
  POT_VISITOR_DATA: ""
  # ── LLM / general-query defaults ────────────────────────────────────
  LLM_API_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
  # ── Admin / guild-policy (non-secret, empty-safe) ───────────────────
  # BOT_OWNER_ID is the Discord user id of the bot owner; it is read by
  # guild_policy.py as an admin. Empty is safe: the policy then fails open
  # (authorized by default) with a loud warning when no OAuth admins exist.
  BOT_OWNER_ID: ""
  # ── Stem isolation (optional heavy model; empty is safe) ────────────
  # STEM_MODEL selects a separation model (e.g. demucs or an ONNX path).
  # When unset, /stems falls back to whichever backend is importable.
  STEM_MODEL: ""
  # ── Direct stream services (sidecars in same pod) ──────────────────
  # These bypass YouTube mirroring for Spotify/Tidal by streaming audio
  # directly from those services using Premium account credentials.
  TIDAL_STREAM_URL: "http://localhost:8801"
  SPOTIFY_STREAM_URL: "http://localhost:8802"
  # ── PoToken server (bgutil-ytdlp-pot-provider, in-cluster) ────────
  # The bot periodically fetches fresh poTokens from this service and pushes
  # them to Lavalink. Default refresh interval: 3600s (1 hour).
  POTOKEN_SERVER_URL: "http://potoken-server.hellodj-service.svc.cluster.local:4416"
  POTOKEN_REFRESH_INTERVAL: "3600"
