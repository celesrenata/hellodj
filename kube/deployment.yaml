apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellodj
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: bot
    helm.sh/chart: hellodj-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: hellodj
      app.kubernetes.io/name: hellodj
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hellodj
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/name: hellodj
        app.kubernetes.io/version: latest
        app.kubernetes.io/component: bot
        helm.sh/chart: hellodj-0.1.0
    spec:
      # dnsPolicy: ClusterFirst (supported on this k3s cluster). dnsConfig lists
      # explicit upstream nameservers so that if CoreDNS fails to resolve external
      # hostnames (gateway.discord.gg / discord.gg), the bot falls back to host DNS.
      # Fixes the `Temporary failure in name resolution` reconnect loop that
      # starves the /play voice handshake (VOICE_STATE_UPDATE + VOICE_SERVER_UPDATE).
      #
      # NOTE: no custom `searches` are set. A `search celestium.life` entry hijacks
      # short external hostnames (e.g. maven.lavalink.dev -> a wildcard *.celestium.life
      # IP), breaking the lavalink sidecar's startup plugin download. Kube's own
      # cluster search domains remain in place.
      #
      # Verified 2026-08-14 (live pod): DNS resolves correctly in-pod
      # (gateway.discord.gg -> 162.159.13x.234, maven.lavalink.dev -> 89.58.40.223,
      # no celestium.life search entry). The residual gateway reconnect loop is an
      # idle/NAT timeout on the long-lived websocket, not a DNS failure: the kernel
      # default tcp_keepalive_time=7200s never probes before a middlebox kills the
      # idle socket, so the gateway stalls until a 30s voice handshake timeout.
      # Lower the (namespaced, SAFE) sysctl to 60s so the kernel detects the dead
      # peer promptly and the gateway tears down/reconnects cleanly instead of
      # starving the /play handshake.
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 192.168.42.1
          - 192.168.99.42
      imagePullSecrets:
        - name: harbor-credentials
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        supplementalGroups:
          - 26    # video group — access to /dev/dri/renderD* for QSV
        sysctls:
          - name: net.ipv4.tcp_keepalive_time
            value: "60"
      initContainers:
        # ── Render lavalink application.yml from the credential store ─────
        # Uses the bot image (has Python + cryptography) to run
        # render_lavalink_config.py which reads ALL credentials (including
        # refreshed Tidal tokens) directly from the encrypted SQLite DB.
        # This ensures Lavalink always starts with current tokens.
        - name: render-lavalink-config
          image: registry.celestium.life/hellodj/bot:unmuted-2026-08-22
          imagePullPolicy: Always
          env:
            - name: HELLODJ_DB_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-db-key
                  key: HELLODJ_DB_KEY
            - name: DATA_DIR
              value: /app/data
          command:
            - python
            - /app/render_lavalink_config.py
            - /out/application.yml
          volumeMounts:
            - name: hellodj-data
              mountPath: /app/data
              readOnly: true
            - name: lavalink-config-rendered
              mountPath: /out
      containers:
        # ── Discord Bot ─────────────────────────────────────────────
        - name: bot
          image: registry.celestium.life/hellodj/bot:unmuted-2026-08-22
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: hellodj-bot-config
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: DISCORD_TOKEN
            - name: HELLODJ_DB_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-db-key
                  key: HELLODJ_DB_KEY
            - name: DISCORD_APPID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: DISCORD_APPID
                  optional: true
            - name: DISCORD_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: DISCORD_PUBKEY
                  optional: true
            - name: LAVALINK_HOST
              value: hellodj.hellodj-service.svc.cluster.local
            - name: LAVALINK_PORT
              value: "2333"
            - name: LAVALINK_PASSWORD
              value: youshallnotpass
            # HF hub cache must live under the writable /app/data PVC;
            # without a HOME/HF_HOME it tries /.cache (PermissionError as UID 1000)
            - name: HF_HOME
              value: /app/data/.huggingface
            - name: HOME
              value: /app/data
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: SPOTIFY_CLIENT_ID
                  optional: true
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: SPOTIFY_CLIENT_SECRET
                  optional: true
            - name: GENIUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_API_KEY
                  optional: true
            - name: GENIUS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_CLIENT_ID
                  optional: true
            - name: GENIUS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_CLIENT_SECRET
                  optional: true
            - name: GENIUS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: GENIUS_ACCESS_TOKEN
                  optional: true
            - name: TIDAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_TOKEN
                  optional: true
            - name: TIDAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_CLIENT_ID
                  optional: true
            - name: TIDAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_CLIENT_SECRET
                  optional: true
            # ── Voice activation: LLM + MCP API keys (secrets) ─────────
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: LLM_API_KEY
                  optional: true
            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: NEWS_API_KEY
                  optional: true
            - name: STOCKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: STOCKS_API_KEY
                  optional: true
          resources:
            limits:
              cpu: "2.5"
              memory: 3Gi
            requests:
              cpu: 1
              memory: 1Gi
          ports:
            - containerPort: 8090
              name: activity
              protocol: TCP
          securityContext:
            # Allow access to /dev/dri/renderD* for QSV video transcoding.
            # The hostPath device node requires device cgroup allowance.
            privileged: true
          volumeMounts:
            - mountPath: /app/data
              name: hellodj-data
            - mountPath: /app/config
              name: hellodj-config
            - mountPath: /app/config-backups
              name: hellodj-config-backups
            - mountPath: /app/models
              name: hellodj-models
              readOnly: true
            - mountPath: /dev/dri
              name: dev-dri
            - mountPath: /tmp/hellodj_hls
              name: hls-tmp

        # ── Lavalink sidecar ───────────────────────────────────────
        - name: lavalink
          image: registry.celestium.life/hellodj/lavalink:tidal-album-search-2026-08-20
          imagePullPolicy: Always
          ports:
            - containerPort: 2333
              name: lavalink
              protocol: TCP
          env:
            - name: LAVALINK_HOST
              value: 0.0.0.0
            - name: LAVALINK_PORT
              value: "2333"
            - name: LAVALINK_PASSWORD
              value: youshallnotpass
            - name: TIDAL_COUNTRY_CODE
              value: US
            - name: TIDAL_SEARCH_LIMIT
              value: "6"
            - name: TIDAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_CLIENT_ID
                  optional: true
            - name: TIDAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_CLIENT_SECRET
                  optional: true
            - name: TIDAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hellodj-secret
                  key: TIDAL_TOKEN
                  optional: true
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /v4/info
              port: lavalink
              httpHeaders:
                - name: Authorization
                  value: youshallnotpass
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /v4/info
              port: lavalink
              httpHeaders:
                - name: Authorization
                  value: youshallnotpass
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v4/info
              port: lavalink
              httpHeaders:
                - name: Authorization
                  value: youshallnotpass
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - mountPath: /opt/Lavalink/application.yml
              name: lavalink-config-rendered
              readOnly: true
              subPath: application.yml

        # ── Tidal stream sidecar ───────────────────────────────────
        # Direct audio streaming from Tidal via tidalapi.
        # Reads OAuth tokens from /app/data/oauth.json (shared with bot + web-ui).
        - name: tidal-stream
          image: registry.celestium.life/hellodj/tidal-stream:whiteboard-2026-08-20
          imagePullPolicy: Always
          ports:
            - containerPort: 8801
              name: tidal-stream
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /app/data
            - name: TIDAL_STREAM_PORT
              value: "8801"
            - name: TIDAL_QUALITY
              value: low_320k
            - name: HELLODJ_DB_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-db-key
                  key: HELLODJ_DB_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: tidal-stream
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: tidal-stream
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /app/data
              name: hellodj-data

        # ── Spotify stream sidecar ─────────────────────────────────
        # Direct audio streaming from Spotify via librespot-python.
        # Decrypts audio in real-time and serves as HTTP stream.
        - name: spotify-stream
          image: registry.celestium.life/hellodj/spotify-stream:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8802
              name: spotify-stream
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /app/data
            - name: SPOTIFY_STREAM_PORT
              value: "8802"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: spotify-stream
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: spotify-stream
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /app/data
              name: hellodj-data

      volumes:
        - name: hellodj-data
          persistentVolumeClaim:
            claimName: hellodj-data-pvc
        - name: hellodj-config
          persistentVolumeClaim:
            claimName: hellodj-config-pvc
        - name: hellodj-config-backups
          emptyDir: {}
        - name: lavalink-config-rendered
          emptyDir: {}
        - name: hellodj-models
          persistentVolumeClaim:
            claimName: hellodj-models-pvc
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: hls-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
