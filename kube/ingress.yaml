apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hellodj-ingress
  namespace: hellodj-service
  annotations:
    cert-manager.io/cluster-issuer: celestium-le-production
    traefik.ingress.kubernetes.io/affinity: "true"
    # WebSocket: Traefik v2/v3 upgrades connections transparently when the
    # client sends Upgrade: websocket. No additional annotation is required.
    # The /activity/ prefix path covers /activity/ws/{guild_id} for the
    # video Activity sync hub. Long-lived connections (up to 8h session max)
    # are safe — Traefik does not apply read timeouts to upgraded WebSockets.
    # Keepalive: pod sysctl tcp_keepalive_time=60s + WS hub 30s ping.
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: ingress
    helm.sh/chart: hellodj-0.1.0
spec:
  ingressClassName: traefik
  rules:
    - host: hellodj.celestium.life
      http:
        paths:
          - path: /activity/
            pathType: Prefix
            backend:
              service:
                name: hellodj
                port:
                  number: 8090
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hellodj-web-ui
                port:
                  number: 8080
  tls:
    - hosts:
        - hellodj.celestium.life
      secretName: hellodj-tls
