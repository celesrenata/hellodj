# Secret for the yt-cipher remote signature-deciphering service.
#
# yt-cipher (https://github.com/kikkia/yt-cipher) offloads YouTube player-script
# signature deciphering from the youtube-source plugin's local extractor, which
# breaks when YouTube changes its player script ("Must find sig function").
#
# The API_TOKEN is shared between:
#   - the yt-cipher container (API_TOKEN env var — rejects unauthenticated requests)
#   - the Lavalink youtube-source plugin (remoteCipher.password)
#
# Generated: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: yt-cipher-secret
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: lavalink
    helm.sh/chart: hellodj-0.1.0
type: Opaque
stringData:
  API_TOKEN: "6e3820e778cf5752564ced8af311d5f896aaa9af57d37e98316aa36ac80bb47b"
