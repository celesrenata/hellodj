apiVersion: v1
kind: ConfigMap
metadata:
  name: lavalink-config
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: lavalink
    helm.sh/chart: hellodj-0.1.0
data:
  application.yml: |
    # Lavalink configuration for HelloDJ
    # Deployed as sidecar alongside the Discord bot

    lavalink:
      server:
        host: "0.0.0.0"
        port: 2333
        password: "youshallnotpass"
        pluginsDir: "./plugins"
      buffer:
        period: 500
        periodMilliseconds: 500
      limits:
        memory: 0
        cpu: 0

      plugins:
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.2.0"
          repository: "https://maven.lavalink.dev/releases"
          snapshot: false

    plugins:
      lavasrc:
        sources:
          tidal: true
        tidal:
          countryCode: "US"
          searchLimit: 6
          token: "${TIDAL_TOKEN}"

    sources:
      youtube:
        enabled: true
      youtubemusic:
        enabled: true
      soundcloud:
        enabled: true
      spotify:
        enabled: false  # Requires Spotify credentials in the bot, not in Lavalink

    filters:
      enabled: true
      timescale:
        enabled: true
      rotation:
        enabled: true
      equalizer:
        enabled: true

    server:
      port: 2333
