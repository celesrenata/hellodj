apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lavalink-pool
  namespace: hellodj-service
  labels:
    app.kubernetes.io/name: hellodj-lavalink
    app.kubernetes.io/component: lavalink
    app.kubernetes.io/part-of: hellodj
spec:
  serviceName: lavalink-pool
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hellodj-lavalink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hellodj-lavalink
        app.kubernetes.io/component: lavalink
        app.kubernetes.io/part-of: hellodj
    spec:
      imagePullSecrets:
        - name: harbor-credentials
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Render application.yml from the credential store (same pattern as main deployment)
        - name: render-lavalink-config
          image: registry.celestium.life/hellodj/bot:visualizer-menu-2026-08-25
          imagePullPolicy: Always
          env:
            - name: HELLODJ_DB_KEY
              valueFrom:
                secretKeyRef:
                  name: hellodj-db-key
                  key: HELLODJ_DB_KEY
            - name: DATA_DIR
              value: /app/data
          command:
            - python
            - /app/render_lavalink_config.py
            - /out/application.yml
          volumeMounts:
            - name: hellodj-data
              mountPath: /app/data
              readOnly: true
            - name: lavalink-config-rendered
              mountPath: /out
      containers:
        - name: lavalink
          image: registry.celestium.life/hellodj/lavalink:audio-pipe-2026-08-23
          imagePullPolicy: Always
          ports:
            - containerPort: 2333
              name: lavalink
              protocol: TCP
          env:
            - name: LAVALINK_HOST
              value: "0.0.0.0"
            - name: LAVALINK_PORT
              value: "2333"
            - name: LAVALINK_PASSWORD
              value: youshallnotpass
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /v4/info
              port: lavalink
              httpHeaders:
                - name: Authorization
                  value: youshallnotpass
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /v4/info
              port: lavalink
              httpHeaders:
                - name: Authorization
                  value: youshallnotpass
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v4/info
              port: lavalink
              httpHeaders:
                - name: Authorization
                  value: youshallnotpass
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - mountPath: /opt/Lavalink/application.yml
              name: lavalink-config-rendered
              readOnly: true
              subPath: application.yml
      volumes:
        - name: hellodj-data
          persistentVolumeClaim:
            claimName: hellodj-data-pvc
        - name: lavalink-config-rendered
          emptyDir: {}
