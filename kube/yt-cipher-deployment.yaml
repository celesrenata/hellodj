# yt-cipher — remote YouTube signature deciphering service.
#
# The youtube-source plugin (1.18.2) uses local cipher extraction by default,
# which breaks when YouTube changes its player script ("Must find sig function").
# yt-cipher offloads this to a dedicated Deno-based service that tracks YouTube's
# current script format.
#
# Image: ghcr.io/kikkia/yt-cipher:master (Deno + yt-dlp/ejs)
# Port:  8001
# Env:   OVERRIDE_PLAYER_VARIANT=IAS (recommended by upstream for reliability)
#        API_TOKEN (from yt-cipher-secret) — rejects unauthenticated requests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-cipher
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: yt-cipher
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: lavalink
    helm.sh/chart: hellodj-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: hellodj
      app.kubernetes.io/name: yt-cipher
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hellodj
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/name: yt-cipher
        app.kubernetes.io/version: latest
        app.kubernetes.io/component: lavalink
        helm.sh/chart: hellodj-0.1.0
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: yt-cipher
          image: ghcr.io/kikkia/yt-cipher:master
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
              protocol: TCP
          env:
            - name: OVERRIDE_PLAYER_VARIANT
              value: IAS
            # Player-script cache location. Without this the container (UID 1000,
            # no HOME) falls back to /.cache which is not writable -> CrashLoop.
            - name: XDG_CACHE_HOME
              value: /cache
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yt-cipher-secret
                  key: API_TOKEN
            - name: MAX_THREADS
              value: "2"
            - name: PREPROCESSED_CACHE_SIZE
              value: "150"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir: {}
