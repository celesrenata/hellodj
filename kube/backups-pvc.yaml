apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hellodj-backups-pvc
  namespace: hellodj-service
  labels:
    app.kubernetes.io/instance: hellodj
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: hellodj
    app.kubernetes.io/component: backups
    helm.sh/chart: hellodj-0.1.0
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 1Gi
  # Bind to the shared NFS backups volume so HelloDJ backups land on the NFS
  # share at /volume1/Kubernetes/HelloDJ/backups.
  volumeName: hellodj-backups-nfs-pv
