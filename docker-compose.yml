version: "3.9"

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:latest
    container_name: hellodj-lavalink
    restart: unless-stopped
    volumes:
      - ./bot/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./bot/lavalink/plugins/:/opt/Lavalink/plugins/
    environment:
      TIDAL_TOKEN: "${TIDAL_TOKEN}"
      # youtube-source plugin OAuth (optional). Leave disabled until a real
      # refresh token is set (see bot/lavalink/application.yml plugins.youtube).
      YOUTUBE_OAUTH_ENABLED: "false"
      YOUTUBE_OAUTH_REFRESH_TOKEN: "${YOUTUBE_OAUTH_REFRESH_TOKEN:-}"
    networks:
      - hellodj-net
    expose:
      - "2333"

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: hellodj-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_PASSWORD: "youshallnotpass"
      # ── Spotify ──────────────────────────────────────────────────────
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      # ── Voice activation ──────────────────────────────────────────────
      WAKE_WORD_MODEL_PATH: /app/models/Hello_DJ.onnx
      STT_MODEL_SIZE: base
      TTS_ENGINE: kokoro
      TTS_VOICE: af_heart
      SPEACHES_URL: "${SPEACHES_URL:-}"
      VOICE_ENABLED: "true"
      # ── LLM (general voice queries) ────────────────────────────────────
      LLM_API_URL: "${LLM_API_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      # ── MCP / general-query API keys (optional) ───────────────────────
      NEWS_API_KEY: "${NEWS_API_KEY:-}"
      STOCKS_API_KEY: "${STOCKS_API_KEY:-}"
    volumes:
      - ./bot:/app
      - hellodj-data:/app/data
      - ./models:/app/models
    networks:
      - hellodj-net
    depends_on:
      - lavalink

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: hellodj-web-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./bot/.env
    environment:
      HELLODJ_DATA_DIR: /app/data
      HELLODJ_CONFIG_DIR: /app/config
      HELLODJ_BACKUP_DIR: /app/config-backups
      # ── Discord OAuth (web UI) ────────────────────────────────────────
      DISCORD_APPID: "${DISCORD_APPID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      FLASK_SECRET: "${FLASK_SECRET:-}"
    volumes:
      - hellodj-data:/app/data
      - hellodj-config:/app/config
      - hellodj-backups:/app/config-backups
    networks:
      - hellodj-net

networks:
  hellodj-net:
    driver: bridge

volumes:
  hellodj-data:
  hellodj-config:
  hellodj-backups:
