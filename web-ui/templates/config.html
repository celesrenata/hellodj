{% extends "base.html" %}
{% block title %}Configuration{% endblock %}

{% block content %}
<style>
    /* P3-1: Mobile config form label spacing */
    @media (max-width: 576px) {
        .form-label { margin-bottom: .5rem; }
        .mb-3 { margin-bottom: 1rem; }
    }
</style>
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="bi bi-gear"></i> HelloDJ Configuration
            <small class="text-muted fs-6">— Edit bot settings</small>
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-discord"></i> Discord
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="discord-token">Bot Token</label>
                    <input type="password" class="form-control" id="discord-token" placeholder="DISCORD_TOKEN">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="discord-appid">Application ID</label>
                    <input class="form-control" id="discord-appid" placeholder="DISCORD_APPID">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="discord-pubkey">Public Key</label>
                    <input class="form-control" id="discord-pubkey" placeholder="DISCORD_PUBKEY">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-3">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-speaker"></i> Lavalink
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="lavalink-host">Host</label>
                    <input class="form-control" id="lavalink-host" placeholder="losingtime.dpaste.org">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="lavalink-port">Port</label>
                    <input type="number" class="form-control" id="lavalink-port" placeholder="2124">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="lavalink-password">Password</label>
                    <input type="password" class="form-control" id="lavalink-password" placeholder="SleepingOnTrains">
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-spotify"></i> Spotify
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="spotify-id">Client ID</label>
                    <input class="form-control" id="spotify-id" placeholder="SPOTIFY_CLIENT_ID">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="spotify-secret">Client Secret</label>
                    <input type="password" class="form-control" id="spotify-secret" placeholder="SPOTIFY_CLIENT_SECRET">
                </div>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-header">
                <i class="bi bi-magic"></i> Genius (Lyrics)
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="genius-key">API Key</label>
                    <input type="password" class="form-control" id="genius-key" placeholder="GENIUS_API_KEY">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-3">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-mic"></i> Voice Activation
            </div>
            <div class="card-body">
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="voice-enabled">
                    <label class="form-check-label" for="voice-enabled">Enabled (wake word + voice commands)</label>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-model-path">Wake Word Model Path</label>
                    <input class="form-control" id="voice-model-path" placeholder="/app/models/Hello_DJ.onnx">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-stt-size">STT Model Size</label>
                    <select class="form-select" id="voice-stt-size">
                        <option value="base">base</option>
                        <option value="small">small</option>
                        <option value="medium">medium</option>
                        <option value="large-v3">large-v3</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-tts-engine">TTS Engine</label>
                    <select class="form-select" id="voice-tts-engine">
                        <option value="kokoro">kokoro</option>
                        <option value="speaches">speaches</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-tts-voice">TTS Voice</label>
                    <input class="form-control" id="voice-tts-voice" placeholder="af_heart">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-speaches-url">Speaches URL (TTS_ENGINE=speaches)</label>
                    <input class="form-control" id="voice-speaches-url" placeholder="https://...">
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-stars"></i> Voice LLM & Data
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="voice-llm-url">LLM API URL</label>
                    <input class="form-control" id="voice-llm-url" placeholder="https://api.openai.com/v1">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-llm-model">LLM Model</label>
                    <input class="form-control" id="voice-llm-model" placeholder="gpt-4o-mini">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-llm-key">LLM API Key</label>
                    <input type="password" class="form-control" id="voice-llm-key" placeholder="LLM_API_KEY">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-news-key">News API Key</label>
                    <input type="password" class="form-control" id="voice-news-key" placeholder="NEWS_API_KEY">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="voice-stocks-key">Stocks API Key</label>
                    <input type="password" class="form-control" id="voice-stocks-key" placeholder="STOCKS_API_KEY">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-wrench"></i> Bot Settings
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="bot-default-source">Default Source Provider</label>
                    <select class="form-select" id="bot-default-source">
                        <option value="youtube">YouTube</option>
                        <option value="youtube_music">YouTube Music</option>
                        <option value="soundcloud">SoundCloud</option>
                        <option value="spotify">Spotify</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="bot-autoplay">Default Autoplay</label>
                    <select class="form-select" id="bot-autoplay">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="bot-repeat">Default Repeat Mode</label>
                    <select class="form-select" id="bot-repeat">
                        <option value="off">Off</option>
                        <option value="single">Single Track</option>
                        <option value="queue">Full Queue</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-3">
    <div class="col-12">
        <button class="btn btn-hellodj btn-lg" onclick="saveConfig()">
            <i class="bi bi-check-circle"></i> Save Configuration
        </button>
        <button class="btn btn-outline-hellodj btn-lg" onclick="loadConfig()">
            <i class="bi bi-arrow-clockwise"></i> Reload
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(async function() {
    await loadConfig();
});

async function loadConfig() {
    const cfg = await apiFetch('/api/config');
    if (!cfg) return;

    $('#discord-token').val(cfg.discord.token || '');
    $('#discord-appid').val(cfg.discord.app_id || '');
    $('#discord-pubkey').val(cfg.discord.pub_key || '');
    $('#lavalink-host').val(cfg.lavalink.host || '');
    $('#lavalink-port').val(cfg.lavalink.port || '2124');
    $('#lavalink-password').val(cfg.lavalink.password || '');
    $('#spotify-id').val(cfg.spotify.client_id || '');
    $('#spotify-secret').val(cfg.spotify.client_secret || '');
    $('#genius-key').val(cfg.genius.api_key || '');
    if (cfg.voice) {
        $('#voice-enabled').prop('checked', cfg.voice.enabled);
        $('#voice-model-path').val(cfg.voice.model_path || '');
        $('#voice-stt-size').val(cfg.voice.stt_model_size || 'base');
        $('#voice-tts-engine').val(cfg.voice.tts_engine || 'kokoro');
        $('#voice-tts-voice').val(cfg.voice.tts_voice || '');
        $('#voice-speaches-url').val(cfg.voice.speaches_url || '');
        $('#voice-llm-url').val(cfg.voice.llm_api_url || '');
        $('#voice-llm-model').val(cfg.voice.llm_model || '');
        $('#voice-llm-key').val(cfg.voice.llm_api_key || '');
        $('#voice-news-key').val(cfg.voice.news_api_key || '');
        $('#voice-stocks-key').val(cfg.voice.stocks_api_key || '');
    }
    if (cfg.bot) {
        $('#bot-default-source').val(cfg.bot.default_source || 'youtube');
        $('#bot-autoplay').val(cfg.bot.autoplay ? 'true' : 'false');
        $('#bot-repeat').val(cfg.bot.repeat || 'off');
    }
}

async function saveConfig() {
    const data = {
        discord: {
            token: $('#discord-token').val(),
            app_id: $('#discord-appid').val(),
            pub_key: $('#discord-pubkey').val(),
        },
        lavalink: {
            host: $('#lavalink-host').val(),
            port: parseInt($('#lavalink-port').val()) || 2124,
            password: $('#lavalink-password').val(),
        },
        spotify: {
            client_id: $('#spotify-id').val(),
            client_secret: $('#spotify-secret').val(),
        },
        genius: {
            api_key: $('#genius-key').val(),
        },
        voice: {
            model_path: $('#voice-model-path').val(),
            stt_model_size: $('#voice-stt-size').val(),
            tts_engine: $('#voice-tts-engine').val(),
            tts_voice: $('#voice-tts-voice').val(),
            speaches_url: $('#voice-speaches-url').val(),
            enabled: $('#voice-enabled').prop('checked'),
            llm_api_url: $('#voice-llm-url').val(),
            llm_model: $('#voice-llm-model').val(),
            llm_api_key: $('#voice-llm-key').val(),
            news_api_key: $('#voice-news-key').val(),
            stocks_api_key: $('#voice-stocks-key').val(),
        },
        bot: {
            default_source: $('#bot-default-source').val(),
            autoplay: $('#bot-autoplay').val() === 'true',
            repeat: $('#bot-repeat').val(),
        }
    };

    const result = await apiFetch('/api/config', {
        method: 'POST',
        body: JSON.stringify(data),
    });

    if (result && result.status === 'ok') {
        showToast(result.message, 'success');
    }
}
</script>
{% endblock %}
