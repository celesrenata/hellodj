{% extends "base.html" %}
{% block title %}Logs{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="bi bi-journal-text"></i> Logs
            <small class="text-muted fs-6">— View recent web UI & bot activity</small>
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-journal-text"></i> Log Tail
                <button class="btn btn-sm btn-hellodj float-end" onclick="refreshLogs()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#webui-tab" type="button" role="tab">
                            Web UI
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#bot-tab" type="button" role="tab">
                            Bot
                        </button>
                    </li>
                </ul>
                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="webui-tab" role="tabpanel">
                        <pre id="webui-log" class="log-viewer">Loading...</pre>
                    </div>
                    <div class="tab-pane fade" id="bot-tab" role="tabpanel">
                        <pre id="bot-log" class="log-viewer">Loading...</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(async function() {
    await refreshLogs();
});

async function refreshLogs() {
    const data = await apiFetch('/api/logs?lines=200');
    if (!data) return;
    $('#webui-log').text((data.webui || []).join('\n') || '(no log content)');
    $('#bot-log').text((data.bot || []).join('\n') || '(no log content)');
}
</script>
{% endblock %}
