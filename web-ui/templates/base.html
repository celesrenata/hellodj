<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloDJ Configuration — {% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --hellodj-primary: #6f42c1;
            --hellodj-secondary: #212529;
        }
        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        .navbar {
            background-color: var(--hellodj-secondary);
            border-bottom: 2px solid var(--hellodj-primary);
        }
        .navbar-brand {
            color: #bb86fc !important;
            font-weight: 700;
            font-size: 1.4rem;
        }
        .nav-link {
            color: #e0e0e0 !important;
            transition: color 0.2s;
        }
        .nav-link.active, .nav-link:hover {
            color: #bb86fc !important;
        }
        .card {
            background-color: #2d2d44;
            border: 1px solid #3a3a5c;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .card-header {
            background-color: #252537;
            border-bottom: 1px solid #3a3a5c;
            font-weight: 600;
        }
        .form-control, .form-select {
            background-color: #252537;
            border: 1px solid #3a3a5c;
            color: #e0e0e0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2d2d44;
            border-color: #bb86fc;
            color: #e0e0e0;
            box-shadow: 0 0 0 0.2rem rgba(187, 134, 252, 0.25);
        }
        .btn-hellodj {
            background-color: #6f42c1;
            border-color: #6f42c1;
            color: #fff;
        }
        .btn-hellodj:hover {
            background-color: #5a32a0;
            border-color: #5a32a0;
            color: #fff;
        }
        .btn-outline-hellodj {
            border-color: #6f42c1;
            color: #bb86fc;
        }
        .btn-outline-hellodj:hover {
            background-color: #6f42c1;
            color: #fff;
        }
        .badge-hellodj {
            background-color: #6f42c1;
            color: #fff;
        }
        .table {
            color: #e0e0e0;
        }
        .table td, .table th {
            border-color: #3a3a5c;
        }
        .table-hover tbody tr:hover {
            background-color: #2d2d44;
        }
        .alert {
            border-radius: 10px;
        }
        .modal-content {
            background-color: #2d2d44;
            border: 1px solid #3a3a5c;
        }
        .modal-header {
            border-bottom: 1px solid #3a3a5c;
        }
        .modal-footer {
            border-top: 1px solid #3a3a5c;
        }
        .btn-close {
            filter: invert(1);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.ok { background-color: #4caf50; }
        .status-dot.warn { background-color: #ff9800; }
        .status-dot.err { background-color: #f44336; }
        footer {
            border-top: 1px solid #3a3a5c;
            background-color: var(--hellodj-secondary);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="bi bi-music-note-beamed"></i> HelloDJ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="{{ url_for('index') }}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'config' %}active{% endif %}" href="{{ url_for('config_page') }}">
                            <i class="bi bi-gear"></i> Config
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'guilds' %}active{% endif %}" href="{{ url_for('guilds_page') }}">
                            <i class="bi bi-people"></i> Guilds
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'playlists' %}active{% endif %}" href="{{ url_for('playlists_page') }}">
                            <i class="bi bi-queue-music"></i> Playlists
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'backups' %}active{% endif %}" href="{{ url_for('backups_page') }}">
                            <i class="bi bi-archive"></i> Backups
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'blacklist' %}active{% endif %}" href="{{ url_for('blacklist_page') }}">
                            <i class="bi bi-shield-exclamation"></i> Blacklist
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 mt-4">
        <small class="text-muted">
            <i class="bi bi-music-note-beamed"></i> HelloDJ — Discord Music Bot Configuration Interface
            <br>Configs stored on NFS: {{ nfs_path or 'N/A' }}
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Global AJAX helpers
        function showToast(message, type = 'success') {
            const toast = `<div class="toast-container position-fixed bottom-0 end-0 p-3">
                <div class="toast align-items-center text-bg-${type} border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            </div>`;
            $('body').append(toast);
            const el = $('.toast').last();
            const bsToast = new bootstrap.Toast(el[0]);
            bsToast.show();
            setTimeout(() => el.remove(), 5000);
        }

        async function apiFetch(url, options = {}) {
            try {
                const resp = await fetch(url, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                const data = await resp.json();
                if (data.error) showToast(data.error, 'danger');
                return data;
            } catch (err) {
                showToast(err.message, 'danger');
                return null;
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
