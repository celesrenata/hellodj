{% extends "base.html" %}
{% block title %}Guilds{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="bi bi-people"></i> Connected Guilds
            <small class="text-muted fs-6">— Live bot guild list</small>
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-people"></i> Guilds
                <button class="btn btn-sm btn-outline-hellodj float-end" onclick="refreshGuilds()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="guilds-table">
                        <thead>
                            <tr>
                                <th>Guild ID</th>
                                <th>Name</th>
                                <th>Members</th>
                                <th>Channels</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="guilds-body">
                            <tr><td colspan="5" class="text-muted text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(async function() {
    await refreshGuilds();
});

async function refreshGuilds() {
    const data = await apiFetch('/api/guilds');
    if (!data) return;

    const tbody = $('#guilds-body');
    if (!data.guilds || data.guilds.length === 0) {
        tbody.html('<tr><td colspan="5" class="text-muted text-center">No guilds connected</td></tr>');
        return;
    }

    tbody.html(data.guilds.map(g => `
        <tr>
            <td><code>${g.id}</code></td>
            <td>
                ${g.icon
                    ? `<img src="https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png" alt="" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:6px;">`
                    : ''}
                ${g.name || '—'}
            </td>
            <td>${g.member_count} member(s)</td>
            <td>
                ${(g.channels || []).length
                    ? g.channels.map(c => `<span class="badge bg-secondary me-1">${c.name}</span>`).join('')
                    : '—'}
            </td>
            <td>
                <button class="btn btn-sm btn-outline-danger" onclick="clearGuild('${g.id}')">
                    <i class="bi bi-x-circle"></i>
                </button>
            </td>
        </tr>
    `).join(''));
}

async function clearGuild(gid) {
    if (!confirm(`Clear session for guild ${gid}?`)) return;
    const result = await apiFetch(`/api/guilds/${gid}`, { method: 'DELETE' });
    if (result && result.status === 'ok') {
        showToast(result.message, 'success');
    }
}
</script>
{% endblock %}
