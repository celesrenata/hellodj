{% extends "base.html" %}
{% block title %}Blacklist{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="bi bi-shield-exclamation"></i> User Blacklist
            <small class="text-muted fs-6">— Revoked users per guild</small>
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-shield-exclamation"></i> Blacklist Management
                <button class="btn btn-sm btn-outline-hellodj float-end" onclick="refreshBlacklist()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body">
                <div id="blacklist-content">
                    <p class="text-muted">Loading...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(async function() {
    await refreshBlacklist();
});

async function refreshBlacklist() {
    const data = await apiFetch('/api/blacklist');
    if (!data) return;

    const container = $('#blacklist-content');
    const bl = data.blacklist || {};

    const keys = Object.keys(bl);
    if (keys.length === 0) {
        container.html('<p class="text-muted">No revoked users. All clear!</p>');
        return;
    }

    let html = '';
    for (const [gid, users] of Object.entries(bl)) {
        html += `<div class="mb-3">
            <h6><code>Guild ${gid}</code> — ${users.length} revoked user(s)</h6>
            <ul class="list-unstyled">`;
        for (const uid of users) {
            html += `<li><span class="status-dot err"></span> User ID: <code>${uid}</code></li>`;
        }
        html += `</ul></div>`;
    }
    container.html(html);
}
</script>
{% endblock %}
